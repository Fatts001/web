<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertanyaan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 25px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            border: none;
            padding: 13px 28px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #yes {
            background: #4caf50;
            color: white;
        }

        #no {
            background: #f44336;
            color: white;
            position: relative;
        }

        #photo {
            display: none;
            margin-top: 25px;
        }

        #photo img {
            width: 280px;
            max-width: 90vw;
            border-radius: 15px;
        }

        #message {
            margin-top: 15px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Mau lihat fotonya? 👀</h1>

        <div class="buttons">
            <button id="yes">YA</button>
            <button id="no">TIDAK</button>
        </div>

        <div id="photo">
            <img src="foto.jpg" alt="Foto">
            <div id="message">Nih fotonya 😎</div>
        </div>

    </div>

    <script>
        const yes = document.getElementById("yes");
        const no = document.getElementById("no");
        const photo = document.getElementById("photo");

        // Tombol YA
        yes.addEventListener("click", function () {
            photo.style.display = "block";
        });

        // Tombol TIDAK kabur
        no.addEventListener("mouseenter", function () {
            pindahTombol();
        });

        no.addEventListener("touchstart", function (e) {
            e.preventDefault();
            pindahTombol();
        });

        function pindahTombol() {
            const maxX = window.innerWidth - no.offsetWidth - 20;
            const maxY = window.innerHeight - no.offsetHeight - 20;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            no.style.position = "fixed";
            no.style.left = x + "px";
            no.style.top = y + "px";
        }
    </script>

</body>
</html>
